name: Build BlockBot APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Extract the exact BlockBot ZIP
        run: |
          rm -rf extracted
          unzip -q BlockBot.zip -d extracted
          test -f extracted/BlockBot/settings.gradle.kts
          echo "Project found:"
          ls -la extracted/BlockBot

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: extracted/BlockBot
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockBot-debug-apk
          path: extracted/BlockBot/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
